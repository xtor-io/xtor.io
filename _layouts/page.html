---
layout: default
---

<header class="{% if page.header_class %}{{ page.header_class }}{% else %}spec-header{% endif %}">
    <div class="container">
        <h1>{{ page.title }}</h1>
        {% if page.subtitle %}
        <p class="subtitle">{{ page.subtitle }}</p>
        {% endif %}
    </div>
</header>

<section class="{% if page.content_class %}{{ page.content_class }}{% else %}spec-content{% endif %}">
    <div class="container">
        {{ content }}
    </div>
</section>
